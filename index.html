<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bright Dreamers Club — Home</title>
    <meta
      name="description"
      content="Bright Dreamers Club — a nonprofit empowering children through learning, creativity, and community."
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="header"></div>

    <main id="main-content">
      <section class="page-hero home-hero" aria-label="Welcome">
        <div class="site-container page-hero__inner">
          <div class="page-hero__content">
            <div class="home-hero__brand">
              <img
                class="home-hero__logo"
                src="assets/images/bright-dreamers-logo.jpeg"
                alt="Bright Dreamers — Dream, Create, Grow, Give"
                width="380"
                height="110"
                decoding="async"
              />
            </div>

            <p class="page-hero__text">
              A nonprofit community where children's ideas become real projects
              that build confidence, creativity, kindness, and positive change.
            </p>

            <div class="page-hero__actions">
              <a class="btn btn--solid btn--lg btn-hover" href="get-involved.html">
                Apply to Become a Bright Dreamer
                <svg
                  class="btn__icon"
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <circle cx="9" cy="9" r="2.6" />
                  <circle cx="15.5" cy="9.5" r="2.2" />
                  <path d="M4.5 19c.7-2.6 2.6-4 4.5-4s3.8 1.4 4.5 4" />
                  <path d="M12.8 18.5c.5-1.8 1.8-2.8 3.2-2.8 1.2 0 2.2.7 2.8 2" />
                </svg>
              </a>
              <a class="btn btn--outline btn--lg btn-hover" href="our-vision.html">
                See Our Vision
                <svg
                  class="btn__icon"
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path
                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                  />
                </svg>
              </a>
            </div>
          </div>

          <div class="home-hero__media">
            <img
              class="home-hero__banner"
              src="assets/images/home-hero-banner.png"
              alt="Three Bright Dreamers holding colorful heart flower drawings in a sunny park"
              width="1200"
              height="900"
              decoding="async"
            />
          </div>
        </div>
      </section>

      <!-- HOME SECTIONS GO HERE -->
    </main>

    <div id="footer"></div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/include.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
