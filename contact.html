<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bright Dreamers Club — Contact</title>
    <meta
      name="description"
      content="Contact Bright Dreamers Club — we'd love to hear from you."
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="header"></div>

    <main id="main-content">
      <section class="page-hero contact-hero" aria-label="Contact Bright Dreamers">
        <div class="site-container page-hero__inner">
          <div class="page-hero__content">
            <h1 class="contact-hero__title">
              <span class="contact-hero__title-row">
                <span class="heading-underline contact-hero__contact-word">
                  Contact
                  <img
                    class="heading-underline__img"
                    src="assets/images/heading-underline.jpeg"
                    alt=""
                    width="120"
                    height="12"
                  />
                </span>
                <span class="contact-hero__us-word">Us</span>
                <svg
                  class="contact-hero__star"
                  viewBox="0 0 24 24"
                  width="28"
                  height="28"
                  fill="none"
                  stroke="var(--color-yellow)"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path
                    d="M12 2.8l2.55 5.35 5.85.7-4.35 3.95 1.2 5.75L12 15.7l-5.25 2.85 1.2-5.75-4.35-3.95 5.85-.7L12 2.8z"
                  />
                </svg>
              </span>
            </h1>

            <svg
              class="contact-hero__heart"
              viewBox="0 0 24 24"
              width="26"
              height="26"
              fill="none"
              stroke="var(--color-plane)"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              />
            </svg>

            <div class="contact-hero__copy">
              <p>We’d love to hear from you.</p>
              <p>
                Whether you have a question, an idea, or want to learn more
                about Bright Dreamers, please reach out.
              </p>
              <p>
                Your message helps us build a
                <span class="contact-hero__accent contact-hero__accent--purple"
                  >brighter</span
                >
                future for kids with
                <span class="contact-hero__accent contact-hero__accent--pink"
                  >ideas</span
                >.
              </p>
            </div>
          </div>

          <div class="contact-hero__media">
            <img
              class="contact-hero__banner"
              src="assets/images/contact-banner.png"
              alt="A Bright Dreamer writing a thank-you card"
              width="1200"
              height="720"
              decoding="async"
            />
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/include.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
