<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bright Dreamers Club — Our Vision</title>
    <meta
      name="description"
      content="Bright Dreamers Club — Our Vision"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="header"></div>

    <main id="main-content">
      <section class="page-hero about-hero" aria-label="Our Vision">
        <div class="site-container page-hero__inner">
          <div class="page-hero__content">
            <p class="about-hero__eyebrow">OUR VISION</p>

            <h1 class="about-hero__title">
              <span class="about-hero__title-line about-hero__title-line--navy">
                Every Child Has a Dream.
              </span>
              <span class="about-hero__title-line about-hero__title-line--pink">
                <span class="heading-underline">
                  We're
                  <img
                    class="heading-underline__img"
                    src="assets/images/heading-underline.jpeg"
                    alt=""
                    width="120"
                    height="12"
                  />
                </span>
                Here to Help It Grow.
              </span>
            </h1>

            <p class="page-hero__text">
              Bright Dreamers is a nonprofit community where children are
              encouraged to dream freely, explore their ideas, create with
              confidence, and make a positive difference in the world.
            </p>

            <div class="page-hero__actions">
              <a class="btn btn--solid btn--lg btn-hover" href="get-involved.html">
                <svg
                  class="btn__icon btn__icon--star"
                  viewBox="0 0 24 24"
                  fill="var(--color-yellow)"
                  aria-hidden="true"
                >
                  <path
                    d="M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 14.8 7.2 17l.9-5.4L4.2 7.7l5.4-.8L12 2z"
                  />
                </svg>
                Apply to Become a Bright Dreamer
              </a>
              <a class="btn btn--outline btn--lg btn-hover" href="about.html">
                About Us
                <svg
                  class="btn__icon"
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path
                    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                  />
                </svg>
              </a>
            </div>
          </div>

          <div class="about-hero__media">
            <img
              class="about-hero__banner"
              src="assets/images/our-vision-hero-banner.png"
              alt="Children painting a mural with the words Big Ideas Brighter Tomorrows"
              width="1200"
              height="900"
              decoding="async"
            />
          </div>
        </div>
      </section>

      <!-- OUR VISION SECTIONS GO HERE -->
    </main>

    <div id="footer"></div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="assets/js/include.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
